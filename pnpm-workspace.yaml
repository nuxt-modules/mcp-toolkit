packages:
  - apps/*
  - packages/*

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  cbor-extract: false
  core-js-pure: false
  better-sqlite3: true
  isolated-vm: true
  sharp: true
  '@mongodb-js/zstd': true
  node-liblzma: true

overrides:
  '@nuxtjs/mcp-toolkit': workspace:*
  unhead: ^3.3.1
  '@unhead/vue': ^3.3.1
  # 2.0.0 is the first stable 2.x and still has CVEs patched in 2.0.1-rc.15+.
  'h3@2.0.0': 2.0.1-rc.26
  # @ai-sdk/provider-utils@4 still pulls undici 5.29.0 (WebSocket DoS CVEs).
  'undici@5.29.0': 6.28.0

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  - 'docus'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  - shaders@3.0.445
  - agents
  - '@iconify-json/simple-icons'
  - '@unhead/*'
  - 'unhead'
  - '@vue-macros/*'
  - 'undici'
  - '@vue/language-core'
  - vue-tsc
  - better-sqlite3@12.10.1
  - '@modelcontextprotocol/sdk@1.30.0'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/server@2.0.0'
