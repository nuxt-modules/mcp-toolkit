name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # changesets/action pushes the release branch, so credentials stay
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # @nuxtjs/mcp-toolkit and nitro-mcp-toolkit publish from two different
      # npm accounts (the Nuxt org vs. a personal account owning the unscoped
      # name), so one bearer token can't authenticate both. pnpm can select a
      # different token per package scope on the same registry host: a
      # scope-specific key for `@nuxtjs/*`, and the registry-wide key as the
      # fallback every unscoped package — i.e. nitro-mcp-toolkit — resolves to.
      # `changeset publish` then needs no per-package handling; it just shells
      # out to `pnpm publish` for each package, which reads this file itself.
      - name: Configure npm auth
        run: |
          {
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_ALPHA}"
            echo "//registry.npmjs.org/:@nuxtjs:_authToken=${NPM_TOKEN}"
          } >> "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN_ALPHA: ${{ secrets.NPM_TOKEN_ALPHA }}

      - name: Prepare
        run: pnpm dev:prepare

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore(repo): version packages"
          version-script: pnpm run version
          publish-script: pnpm run release
          # Releases are created here, then their bodies are rewritten below.
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # create-github-releases gives us one release per package, tagged pkg@version — that part
      # we keep. Its *body* is the CHANGELOG section, which for a dependent package is a wall of
      # "Updated dependencies [<hash>, <hash>, …]" and is empty for packages with no changeset
      # of their own. `--generate-notes` is not the answer either: GitHub builds those from a
      # commit range, and with two packages tagged independently, per-package tags interleave and
      # each package's notes would list everybody's PRs. So we rewrite each body from the PRs that
      # actually touched that package's directory, grouped by the same categories as .github/release.yml.
      - name: Push tags
        if: steps.changesets.outputs.published == 'true'
        run: git push --tags

      - name: Rewrite release notes
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/release-notes.mjs '${{ steps.changesets.outputs.published-packages }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
