name: Nitro benchmarks

on:
  pull_request:
    paths:
      - packages/nitro-mcp-toolkit/**
      - pnpm-lock.yaml
      - .github/workflows/benchmark.yml
  push:
    branches: [main]
    paths:
      - packages/nitro-mcp-toolkit/**
      - pnpm-lock.yaml
      - .github/workflows/benchmark.yml
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline Git ref
        required: true
        default: HEAD^
        type: string
      candidate:
        description: Candidate Git ref
        required: true
        default: HEAD
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          filters: --filter=nitro-mcp-toolkit

      - name: Measure built consumers
        env:
          CANDIDATE: ${{ inputs.candidate || 'HEAD' }}
        run: pnpm bench:consumer "$CANDIDATE" --output "$RUNNER_TEMP/nitro-consumer"

      - name: Publish job summary
        run: cat "$RUNNER_TEMP/nitro-consumer/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitro-consumer-${{ github.sha }}
          path: ${{ runner.temp }}/nitro-consumer
          retention-days: 90
          if-no-files-found: error

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          filters: --filter=nitro-mcp-toolkit

      - name: Compare catalogs with Vitest
        env:
          BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE: ${{ inputs.candidate || 'HEAD' }}
        run: pnpm bench:nitro "$BASELINE" "$CANDIDATE" --output "$RUNNER_TEMP/nitro-benchmark"

      - name: Publish job summary
        run: cat "$RUNNER_TEMP/nitro-benchmark/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitro-catalog-${{ github.sha }}
          path: ${{ runner.temp }}/nitro-benchmark
          retention-days: 90
          if-no-files-found: error
