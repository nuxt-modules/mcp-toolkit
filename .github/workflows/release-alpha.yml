name: release-alpha

# The stable release flow is driven by changesets, which runs in prerelease mode
# for the whole monorepo at once. `nitro-mcp-toolkit` is being written wave by
# wave while `@nuxtjs/mcp-toolkit` keeps shipping stable, so it releases from
# here instead, always under the `alpha` dist-tag.
#
# It authenticates with NPM_TOKEN_ALPHA rather than the NPM_TOKEN the stable
# release uses: the package is owned by a personal npm account, so the Nuxt org
# token gets a 404 on it. Scope that token to this one package.
#
# The version to publish is given here rather than derived from the manifest,
# because nothing can be committed back: `main` is protected and the bot cannot
# push to it. The `alpha` dist-tag on npm is the source of truth for where the
# package is, and the version in the manifest stays a deliberate placeholder —
# see the release section of AGENTS.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish, e.g. 0.1.0-alpha.0'
        required: true
        type: string

concurrency: ${{ github.workflow }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm --filter nitro-mcp-toolkit lint
          pnpm --filter nitro-mcp-toolkit typecheck
          pnpm --filter nitro-mcp-toolkit test
          # Through turbo, unlike the checks above: publint and attw inspect the
          # packed artifact, so this one needs the build its task depends on.
          pnpm run lint:package

      # Without this the failure arrives as a bare npm 404, which reads like the
      # package does not exist rather than like a missing credential.
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.NPM_TOKEN_ALPHA }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::NPM_TOKEN_ALPHA is not set. nitro-mcp-toolkit is owned by a personal npm account, so the org's NPM_TOKEN cannot publish it. Add a granular token scoped to that one package as a repository secret."
            exit 1
          fi

      - name: Check the version is releasable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Currently on the alpha tag: $(npm view nitro-mcp-toolkit@alpha version)"
          if npm view "nitro-mcp-toolkit@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$VERSION is already published. npm versions are immutable, so pick a higher one."
            exit 1
          fi

      - name: Publish
        run: pnpm run release:alpha
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ALPHA }}
          NPM_CONFIG_PROVENANCE: true

      # A tag, and nothing else. The bump is never committed: `main` is
      # protected, so the bot's push is rejected, and the release has already
      # happened by then — which would leave the workflow red over bookkeeping.
      - name: Tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "nitro-mcp-toolkit@$VERSION"
          git push origin "nitro-mcp-toolkit@$VERSION"
