name: release-alpha

# The stable release flow is driven by changesets, which runs in prerelease mode
# for the whole monorepo at once. `nitro-mcp-toolkit` is being written wave by
# wave while `@nuxtjs/mcp-toolkit` keeps shipping stable, so it releases from
# here instead, always under the `alpha` dist-tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (preminor for the first alpha of a new minor)'
        type: choice
        options:
          - prerelease
          - preminor
          - premajor
        default: prerelease

concurrency: ${{ github.workflow }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm --filter nitro-mcp-toolkit lint
          pnpm --filter nitro-mcp-toolkit typecheck
          pnpm --filter nitro-mcp-toolkit test
          pnpm --filter nitro-mcp-toolkit lint:package

      - name: Publish
        run: pnpm run release:alpha
        env:
          BUMP: ${{ inputs.bump }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Record the released version
        run: |
          version=$(node -p "require('./packages/nitro-mcp-toolkit/package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(nitro): release v$version" -- packages/nitro-mcp-toolkit/package.json
          git tag "nitro-mcp-toolkit@$version"
          git push --follow-tags
